[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "A Claude-powered personal assistant with voice I/O and Home Assistant smart home control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "requests",
    "python-dotenv",
    "tzdata",
    "faster-whisper",
    "piper-tts",
    "sounddevice",
    "numpy",
]

# Real WebRTC AEC3 echo cancellation for barge-in (see
# src/personal_assistant/aec.py) - optional because prebuilt wheels only
# cover CPython 3.11-3.13 on Windows as of writing. aec.py falls back to a
# pure-numpy NLMS filter automatically when this isn't installed.
# `pip install -e .[aec]` on a matching interpreter to use it.
[project.optional-dependencies]
aec = ["aec-audio-processing"]

[project.scripts]
personal-assistant = "personal_assistant.assistant:main"

[tool.setuptools.packages.find]
where = ["src"]
